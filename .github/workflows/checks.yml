name: checks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    # Runs the pre-push hook itself, so CI and local checks can't drift apart
    # and a push made with --no-verify still gets checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci

      - name: Install gitleaks, OSV-Scanner and Vale
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          gh=https://github.com
          curl -sSfLO $gh/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfLO $gh/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          curl -sSfLO $gh/vale-cli/vale/releases/download/v3.22.0/vale_3.22.0_Linux_64-bit.tar.gz
          sha256sum -c <<'EOF'
          551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz
          ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner_linux_amd64
          52f5cd0314a1b7384cac6aa102a68193977312f6ba9c9f3ae001b5deec8e3a10  vale_3.22.0_Linux_64-bit.tar.gz
          EOF
          mkdir bin
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz -C bin gitleaks
          tar -xzf vale_3.22.0_Linux_64-bit.tar.gz -C bin vale
          install -m 755 osv-scanner_linux_amd64 bin/osv-scanner
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - if: hashFiles('**/*.py', '!**/node_modules/**') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - if: hashFiles('**/*.py', '!**/node_modules/**') != ''
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt

      - if: hashFiles('**/pubspec.yaml', '!**/node_modules/**') != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7

      - run: sh .githooks/pre-push
