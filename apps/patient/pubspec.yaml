name: patient
description: Patient app. Shows the prep timeline and schedules reminders on the device.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  timeline:
    path: ../../packages/timeline
  timezone: 0.11.1

dev_dependencies:
  clock: 1.1.3
  flutter_test:
    sdk: flutter

dependency_overrides:
  # Remove on 2026-10-27.
  flutter_local_notifications_linux: 8.0.1

flutter:
  uses-material-design: true
