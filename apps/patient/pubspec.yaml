name: patient
description: Patient app. Shows the prep timeline and schedules reminders on the device.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.2
  timeline:
    path: ../../packages/timeline
  timezone: 0.11.2

dev_dependencies:
  clock: 1.1.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
